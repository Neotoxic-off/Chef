name: images

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every image the references run still exists
        run: |
          rc=0
          while read -r image; do
            docker buildx imagetools inspect "${image}" > /dev/null || { echo "::error::${image} is no longer in its registry"; rc=1; }
          done < scripts/container-images.txt
          exit "${rc}"
