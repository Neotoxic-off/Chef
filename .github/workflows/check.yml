name: check

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Test check script
        run: npx --yes bats@1.13.0 tests/check.bats
      - name: Test transform stop gate
        run: npx --yes bats@1.13.0 tests/stop-gate.bats
      - name: Test action pin gate
        run: npx --yes bats@1.13.0 tests/pin-gate.bats
      - name: Test status usage report
        run: npx --yes bats@1.13.0 tests/usage.bats
      - name: Check plugin consistency
        run: bash scripts/check.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Lint, type-check and test bench scorer
        working-directory: bench
        run: |
          python -m pip install --quiet pytest==9.2.0 PyYAML==6.0.3 ruff==0.17.6 mypy==2.4.1 types-PyYAML==6.0.12.20261113
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy --strict score.py test_score.py blind_review.py test_blind_review.py charts.py test_charts.py pairwise_review.py test_pairwise_review.py report.py test_report.py
          for scorer in tasks/*/scorer.py; do python -m mypy --strict "${scorer}"; done
          python -m pytest -q -p no:cacheprovider test_score.py test_blind_review.py test_charts.py test_pairwise_review.py test_report.py
