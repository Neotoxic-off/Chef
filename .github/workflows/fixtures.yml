name: fixtures

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          cache: false
      - name: Score every golden and flawed fixture, Docker ones included
        working-directory: bench
        env:
          # A missing tool or Docker daemon fails the fixture here instead of skipping it.
          BENCH_FIXTURES_STRICT: "1"
        run: |
          python -m pip install --quiet pytest==9.2.0 pytest-cov==7.1.0 PyYAML==6.0.3 ruff==0.17.6 mypy==2.4.1 zizmor==1.32.0
          python -m pytest -q -p no:cacheprovider test_fixtures.py
