<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" role="img" aria-label="Blind panel quality score out of 10 by reviewer seat, without chef versus chef 0.10.0, 15 reviews each. Senior 7.53 vs 7.80, security 7.47 vs 8.07, SRE 7.20 vs 7.53, maintainer 7.47 vs 7.93."><title>Blind panel quality score out of 10 by reviewer seat, without chef versus chef 0.10.0, 15 reviews each. Senior 7.53 vs 7.80, security 7.47 vs 8.07, SRE 7.20 vs 7.53, maintainer 7.47 vs 7.93.</title><text x="0.0" y="26.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Blind panel: quality by reviewer seat (/10)</text><rect x="620.0" y="15.0" width="14.0" height="14.0" rx="3" fill="#4A5059"/><text x="642.0" y="26.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Without chef</text><rect x="750.0" y="15.0" width="14.0" height="14.0" rx="3" fill="#D97757"/><text x="772.0" y="26.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Chef 0.10.0</text><text x="0.0" y="76.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Senior engineer</text><text x="0.0" y="96.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">design and correctness</text><rect x="300.0" y="64.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="64.0" width="361.4" height="14.0" rx="3" fill="#4A5059"/><text x="792.0" y="76.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">7.53</text><rect x="300.0" y="84.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="84.0" width="374.4" height="14.0" rx="3" fill="#D97757"/><text x="792.0" y="96.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">7.80</text><text x="0.0" y="134.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Security reviewer</text><text x="0.0" y="154.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">what an attacker or a mistake could exploit</text><rect x="300.0" y="122.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="122.0" width="358.6" height="14.0" rx="3" fill="#4A5059"/><text x="792.0" y="134.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">7.47</text><rect x="300.0" y="142.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="142.0" width="387.4" height="14.0" rx="3" fill="#D97757"/><text x="792.0" y="154.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">8.07</text><text x="0.0" y="192.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">SRE</text><text x="0.0" y="212.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">deploys it, gets paged when it breaks</text><rect x="300.0" y="180.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="180.0" width="345.6" height="14.0" rx="3" fill="#4A5059"/><text x="792.0" y="192.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">7.20</text><rect x="300.0" y="200.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="200.0" width="361.4" height="14.0" rx="3" fill="#D97757"/><text x="792.0" y="212.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">7.53</text><text x="0.0" y="250.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Maintainer</text><text x="0.0" y="270.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">owns and changes it for two years</text><rect x="300.0" y="238.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="238.0" width="358.6" height="14.0" rx="3" fill="#4A5059"/><text x="792.0" y="250.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">7.47</text><rect x="300.0" y="258.0" width="480.0" height="14.0" rx="3" fill="#30363D"/><rect x="300.0" y="258.0" width="380.6" height="14.0" rx="3" fill="#D97757"/><text x="792.0" y="270.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">7.93</text></svg>
