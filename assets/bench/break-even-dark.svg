<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Machine cost per task plus a human reviewer's cost per review round. Chef 1.4 costs less once a round costs more than $0.18; at $10 per round, plain Claude $14.72 and chef 1.4 $11.19 per task, 24% less."><title>Machine cost per task plus a human reviewer's cost per review round. Chef 1.4 costs less once a round costs more than $0.18; at $10 per round, plain Claude $14.72 and chef 1.4 $11.19 per task, 24% less.</title><text x="0.0" y="26.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Cost per task once the reviewer's time counts</text><line x1="70.0" y1="230.0" x2="600.0" y2="230.0" stroke="#30363D" stroke-width="1"/><text x="70.0" y="248.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$0</text><text x="202.5" y="248.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$5</text><text x="335.0" y="248.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$10</text><text x="467.5" y="248.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$15</text><text x="600.0" y="248.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$20</text><text x="335.0" y="268.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cost of one human review round</text><text x="62.0" y="64.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">$29</text><text x="62.0" y="234.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">$0</text><line x1="70.0" y1="229.3" x2="600.0" y2="60.0" stroke="#4A5059" stroke-width="2.5"/><circle cx="335.0" cy="144.7" r="5" fill="#4A5059"/><text x="345.0" y="148.7" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">$14.72</text><line x1="70.0" y1="228.9" x2="600.0" y2="97.9" stroke="#8A4A35" stroke-width="2.5"/><circle cx="335.0" cy="163.4" r="5" fill="#8A4A35"/><text x="325.0" y="167.4" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end">$11.48</text><line x1="70.0" y1="228.9" x2="600.0" y2="101.4" stroke="#D97757" stroke-width="2.5"/><circle cx="335.0" cy="165.1" r="5" fill="#D97757"/><text x="345.0" y="169.1" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">$11.19</text><rect x="620.0" y="60.0" width="12.0" height="12.0" rx="3" fill="#4A5059"/><text x="638.0" y="71.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Plain Claude: 1.46 reviews per task</text><rect x="620.0" y="84.0" width="12.0" height="12.0" rx="3" fill="#8A4A35"/><text x="638.0" y="95.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Chef 1.3: 1.13 reviews per task</text><rect x="620.0" y="108.0" width="12.0" height="12.0" rx="3" fill="#D97757"/><text x="638.0" y="119.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Chef 1.4: 1.10 reviews per task</text><text x="620.0" y="154.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">Break-even: $0.18 per round</text><text x="620.0" y="174.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">At $10 per round: 24% less</text></svg>
