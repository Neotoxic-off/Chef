<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="Where one chef run's cost goes: cache writes 57%, output 28%, cache reads 15%"><title>Where one chef run's cost goes: cache writes 57%, output 28%, cache reads 15%</title><text x="0.0" y="26.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Where the cost of a chef run goes</text><rect x="0.0" y="48.0" width="499.6" height="28.0" rx="3" fill="#D97757"/><text x="0.0" y="100.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Cache writes 57%</text><text x="0.0" y="118.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">new context: prompt, skill, tool output</text><rect x="501.6" y="48.0" width="244.4" height="28.0" rx="3" fill="#8A4A35"/><text x="501.6" y="100.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Output 28%</text><text x="501.6" y="118.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">code, tests, configs</text><rect x="748.0" y="48.0" width="130.0" height="28.0" rx="3" fill="#4A5059"/><text x="748.0" y="100.0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Cache reads 15%</text><text x="748.0" y="118.0" fill="#9198A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">re-read each call</text></svg>
