<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Machine cost per task plus a human reviewer's cost per review round. Chef 1.5.2 costs less once a round costs more than $0.83; at $10 per round, plain Claude $11.65 and chef 1.5.2 $10.27 per task, 12% less."><title>Machine cost per task plus a human reviewer's cost per review round. Chef 1.5.2 costs less once a round costs more than $0.83; at $10 per round, plain Claude $11.65 and chef 1.5.2 $10.27 per task, 12% less.</title><text x="0.0" y="26.0" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Cost per task once the reviewer's time counts</text><line x1="70.0" y1="230.0" x2="600.0" y2="230.0" stroke="#E6E8EB" stroke-width="1"/><text x="70.0" y="248.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$0</text><text x="202.5" y="248.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$5</text><text x="335.0" y="248.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$10</text><text x="467.5" y="248.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$15</text><text x="600.0" y="248.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">$20</text><text x="335.0" y="268.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cost of one human review round</text><text x="62.0" y="64.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">$23</text><text x="62.0" y="234.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">$0</text><line x1="70.0" y1="228.9" x2="600.0" y2="60.0" stroke="#C9CED6" stroke-width="2.5"/><circle cx="335.0" cy="144.5" r="5" fill="#C9CED6"/><text x="345.0" y="148.5" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">$11.65</text><line x1="70.0" y1="227.2" x2="600.0" y2="80.3" stroke="#EDB59F" stroke-width="2.5"/><circle cx="335.0" cy="153.8" r="5" fill="#EDB59F"/><text x="325.0" y="157.8" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end">$10.38</text><line x1="70.0" y1="228.0" x2="600.0" y2="81.1" stroke="#D97757" stroke-width="2.5"/><circle cx="335.0" cy="154.6" r="5" fill="#D97757"/><text x="345.0" y="158.6" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">$10.27</text><rect x="620.0" y="60.0" width="12.0" height="12.0" rx="3" fill="#C9CED6"/><text x="638.0" y="71.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Plain Claude: 1.15 reviews per task</text><rect x="620.0" y="84.0" width="12.0" height="12.0" rx="3" fill="#EDB59F"/><text x="638.0" y="95.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Chef 1.4: 1.00 reviews per task</text><rect x="620.0" y="108.0" width="12.0" height="12.0" rx="3" fill="#D97757"/><text x="638.0" y="119.0" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Chef 1.5.2: 1.00 reviews per task</text><text x="620.0" y="154.0" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">Break-even: $0.83 per round</text><text x="620.0" y="174.0" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">At $10 per round: 12% less</text></svg>
