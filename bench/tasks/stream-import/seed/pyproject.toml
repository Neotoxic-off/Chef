[project]
name = "ledger-import"
version = "2.3.0"
description = "Import bank statement CSV exports into the ledger."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ledger-import = "ledger_import.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "ANN", "S", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
packages = ["ledger_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
