version: "2"
run:
  timeout: 5m  # v2 has no default timeout
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - gosec
    - revive
    - unparam
    - wrapcheck
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported  # doc comments only on a library's public API
          disabled: true
        - name: package-comments  # same reason as `exported`
          disabled: true
formatters:
  enable:
    - gofumpt
    - goimports
